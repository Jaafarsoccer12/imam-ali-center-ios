name: iOS App Store Upload

on:
  workflow_dispatch:

jobs:
  archive-and-upload:
    runs-on: macos-15
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      BUNDLE_ID: com.partner-auto-5118.imamalicenter
      DEVELOPMENT_TEAM: 4WBMSZSUZ5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install signing assets
        shell: bash
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db" login.keychain-db
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$RUNNER_TEMP/build.keychain-db"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print:Name' "$profile_plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Archive the signed app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ImamAliCenter.xcodeproj \
            -scheme ImamAliCenter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ImamAliCenter.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION=1.0.4 \
            CURRENT_PROJECT_VERSION=4

      - name: Export the App Store package
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $DEVELOPMENT_TEAM" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$export_options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ImamAliCenter.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect with Transporter
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          xcrun altool --upload-app -f "$ipa_path" -t ios -u "$APPLE_ID" -p "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Preserve the signed IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imam-ali-center-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
